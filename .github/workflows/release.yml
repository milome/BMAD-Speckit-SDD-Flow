name: Release Publish

on:
  workflow_dispatch:
    inputs:
      qualifying_run_id:
        description: Successful governed PR CI run ID
        required: true
        type: string
      commit_sha:
        description: Exact qualifying commit SHA
        required: true
        type: string
      full_suite_run_id:
        description: Optional successful same-SHA nightly-full or release-full run ID
        required: false
        type: string
      release_tag:
        description: Optional release tag
        required: false
        type: string
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string
      dry_run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      qualifying_run_id:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      full_suite_run_id:
        required: false
        default: ''
        type: string
      release_tag:
        required: false
        default: ''
        type: string
      npm_tag:
        required: false
        default: latest
        type: string
      dry_run:
        required: false
        default: true
        type: boolean
permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  release-full-fallback:
    if: ${{ inputs.full_suite_run_id == '' }}
    uses: ./.github/workflows/ci.yml
    with:
      requested_profile: release-full
      commit_sha: ${{ inputs.commit_sha }}

  release:
    needs: [release-full-fallback]
    if: ${{ !cancelled() && (inputs.full_suite_run_id != '' || needs.release-full-fallback.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      CI_COMMIT_SHA: ${{ inputs.commit_sha }}
      NPM_REGISTRY: https://registry.npmjs.org
      NPM_TAG: ${{ inputs.npm_tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm

      - name: Install release-only npm CLI for Trusted Publishing
        run: npm install --global npm@11.6.2

      - run: git config core.filemode false

      - run: npm ci --ignore-scripts

      - name: Download exact qualifying PR completion
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.qualifying_run_id }}
          github-token: ${{ github.token }}
          name: ci-final-${{ inputs.commit_sha }}
          path: .artifacts/qualifying/final

      - name: Validate reusable full-suite run provenance
        if: ${{ inputs.full_suite_run_id != '' }}
        uses: actions/github-script@v7
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          FULL_SUITE_RUN_ID: ${{ inputs.full_suite_run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const rawRunId = process.env.FULL_SUITE_RUN_ID || '';
            const expectedCommitSha = (process.env.EXPECTED_COMMIT_SHA || '').toLowerCase();
            if (!/^\d+$/.test(rawRunId)) throw new Error('FULL_SUITE_RUN_ID_INVALID');
            const runId = Number(rawRunId);
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              throw new Error('FULL_SUITE_RUN_ID_INVALID');
            }
            if (!/^[0-9a-f]{40}$/.test(expectedCommitSha)) {
              throw new Error('FULL_SUITE_COMMIT_SHA_INVALID');
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (run.conclusion !== 'success') {
              throw new Error('FULL_SUITE_RUN_NOT_SUCCESSFUL');
            }
            if (String(run.head_sha || '').toLowerCase() !== expectedCommitSha) {
              throw new Error('FULL_SUITE_RUN_SHA_MISMATCH');
            }
            const { data: workflow } = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: run.workflow_id,
            });
            if (workflow.path !== '.github/workflows/ci.yml') {
              throw new Error('FULL_SUITE_RUN_WORKFLOW_INVALID');
            }

      - name: Reuse exact full-suite plan
        if: ${{ inputs.full_suite_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.full_suite_run_id }}
          github-token: ${{ github.token }}
          name: ci-plan-${{ inputs.commit_sha }}
          path: .artifacts/test-portfolio/full-suite/plan

      - name: Reuse exact full-suite completion
        if: ${{ inputs.full_suite_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.full_suite_run_id }}
          github-token: ${{ github.token }}
          name: ci-final-${{ inputs.commit_sha }}
          path: .artifacts/test-portfolio/full-suite/final

      - name: Download matrix fallback plan
        if: ${{ inputs.full_suite_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-plan-${{ inputs.commit_sha }}
          path: .artifacts/test-portfolio/full-suite/plan

      - name: Download matrix fallback completion
        if: ${{ inputs.full_suite_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: ci-final-${{ inputs.commit_sha }}
          path: .artifacts/test-portfolio/full-suite/final

      - name: Prepare the canonical package once for publication
        run: npm run ci:prepare-package -- --commit-sha "$CI_COMMIT_SHA"

      - name: Verify exact evidence with verify-release-evidence-parity.cjs
        run: npm run ci:verify-release-parity -- --pr-evidence .artifacts/qualifying/final/ci-run-manifest.json --full-suite-evidence .artifacts/test-portfolio/full-suite/final/ci-run-manifest.json --catalog .artifacts/test-portfolio/full-suite/plan/test-catalog.json --package-descriptor .artifacts/test-portfolio/package/canonical-package.json

      - name: Verify existing canonical descriptor and tarball
        run: node scripts/prepublish-check.js --verify-descriptor .artifacts/test-portfolio/package/canonical-package.json

      - name: Build release gate runtime
        run: npm run build

      - name: Verify encoding and protected release gates
        run: |
          npm run check:encoding
          npm run verify:hooks
          npm run main-agent:release-gate:ci
          npm run main-agent:quality-gate

      - name: Verify release tag
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::RELEASE_TAG_MISMATCH:expected=$expected actual=$RELEASE_TAG"
            exit 1
          fi

      - name: Publish the qualifying canonical tarball via npm trusted publishing
        shell: bash
        run: |
          tarball=$(node -p "require('./.artifacts/test-portfolio/package/canonical-package.json').tarballPath")
          if [ "$DRY_RUN" = "true" ]; then
            npm publish "$tarball" --dry-run --access public --tag "$NPM_TAG" --registry="$NPM_REGISTRY"
          else
            npm publish "$tarball" --access public --tag "$NPM_TAG" --registry="$NPM_REGISTRY"
          fi

      - name: Upload canonical release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ inputs.commit_sha }}
          path: |
            .artifacts/qualifying/final/ci-run-manifest.json
            .artifacts/test-portfolio/full-suite/final/ci-run-manifest.json
            .artifacts/test-portfolio/full-suite/plan/test-catalog.json
            .artifacts/test-portfolio/package/canonical-package.json
            .artifacts/test-portfolio/package/*.tgz
          if-no-files-found: error
          retention-days: 30
