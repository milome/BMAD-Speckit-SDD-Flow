name: Release Publish

on:
  workflow_dispatch:
    inputs:
      qualifying_run_id:
        description: Successful governed PR CI run ID
        required: true
        type: string
      commit_sha:
        description: Exact qualifying commit SHA
        required: true
        type: string
      release_tag:
        description: Optional release tag
        required: false
        type: string
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string
      dry_run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean
  workflow_call:
    inputs:
      qualifying_run_id:
        required: true
        type: string
      commit_sha:
        required: true
        type: string
      release_tag:
        required: false
        default: ''
        type: string
      npm_tag:
        required: false
        default: latest
        type: string
      dry_run:
        required: false
        default: true
        type: boolean
    secrets:
      npm_token:
        required: false

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CI_COMMIT_SHA: ${{ inputs.commit_sha }}
      NPM_REGISTRY: https://registry.npmjs.org
      NPM_TAG: ${{ inputs.npm_tag }}
      DRY_RUN: ${{ inputs.dry_run }}
      NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm install --global npm@10.9.4

      - run: npm ci

      - name: Download exact qualifying PR plan
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.qualifying_run_id }}
          github-token: ${{ github.token }}
          name: ci-plan-${{ inputs.commit_sha }}
          path: .artifacts/qualifying/plan

      - name: Download exact qualifying PR completion
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.qualifying_run_id }}
          github-token: ${{ github.token }}
          name: ci-final-${{ inputs.commit_sha }}
          path: .artifacts/qualifying/final

      - name: Build release runtime
        run: npm run build

      - name: Run fresh release-full
        run: npm run ci:release-full -- --commit-sha "$CI_COMMIT_SHA" --changed-paths .artifacts/qualifying/plan/changed-paths.json

      - name: Verify exact evidence with verify-release-evidence-parity.cjs
        run: npm run ci:verify-release-parity -- --pr-evidence .artifacts/qualifying/final/ci-run-manifest.json --release-evidence .artifacts/test-portfolio/final/ci-run-manifest.json --catalog .artifacts/test-portfolio/test-catalog.json

      - name: Verify existing canonical descriptor and tarball
        run: node scripts/prepublish-check.js --verify-descriptor .artifacts/test-portfolio/package/canonical-package.json

      - name: Verify encoding and protected release gates
        run: |
          npm run check:encoding
          npm run verify:hooks
          npm run main-agent:release-gate:ci
          npm run main-agent:quality-gate

      - name: Verify release tag
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::RELEASE_TAG_MISMATCH:expected=$expected actual=$RELEASE_TAG"
            exit 1
          fi

      - name: Publish the qualifying canonical tarball
        shell: bash
        run: |
          tarball=$(node -p "require('./.artifacts/test-portfolio/package/canonical-package.json').tarballPath")
          if [ "$DRY_RUN" = "true" ]; then
            npm publish "$tarball" --dry-run --access public --tag "$NPM_TAG" --registry="$NPM_REGISTRY"
          else
            npm publish "$tarball" --access public --tag "$NPM_TAG" --registry="$NPM_REGISTRY"
          fi

      - name: Upload canonical release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ inputs.commit_sha }}
          path: |
            .artifacts/qualifying/final/ci-run-manifest.json
            .artifacts/test-portfolio/final/ci-run-manifest.json
            .artifacts/test-portfolio/package/canonical-package.json
            .artifacts/test-portfolio/package/*.tgz
          if-no-files-found: error
          retention-days: 30
