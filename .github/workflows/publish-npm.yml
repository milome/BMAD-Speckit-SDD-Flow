name: Publish npm

on:
  workflow_dispatch:
    inputs:
      qualifying_run_id:
        description: Successful governed PR CI run ID
        required: true
        type: string
      commit_sha:
        description: Exact qualifying commit SHA
        required: true
        type: string
      full_suite_run_id:
        description: Optional successful same-SHA nightly-full or release-full run ID
        required: false
        type: string
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string
      dry_run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      qualifying_run_id: ${{ inputs.qualifying_run_id }}
      commit_sha: ${{ inputs.commit_sha }}
      full_suite_run_id: ${{ inputs.full_suite_run_id }}
      npm_tag: ${{ inputs.npm_tag }}
      dry_run: ${{ inputs.dry_run }}
