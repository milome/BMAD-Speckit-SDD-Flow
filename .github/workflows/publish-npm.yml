name: Publish npm

on:
  workflow_dispatch:
    inputs:
      qualifying_run_id:
        description: Successful governed PR CI run ID
        required: true
        type: string
      commit_sha:
        description: Exact qualifying commit SHA
        required: true
        type: string
      npm_tag:
        description: npm dist-tag
        required: true
        default: latest
        type: string
      dry_run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      qualifying_run_id: ${{ inputs.qualifying_run_id }}
      commit_sha: ${{ inputs.commit_sha }}
      npm_tag: ${{ inputs.npm_tag }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      npm_token: ${{ secrets.NPM_TOKEN }}
