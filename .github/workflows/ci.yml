name: CI

on:
  pull_request:
    branches: [dev, main, master]
  merge_group:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      requested_profile:
        description: Governed CI profile
        required: false
        default: nightly-full
        type: choice
        options:
          - pr-fast
          - pr-full
          - nightly-deep
          - nightly-full
          - release-verify
          - release-full
      base_sha:
        description: Required base commit for impact-sensitive profiles
        required: false
        type: string
  workflow_call:
    inputs:
      requested_profile:
        required: false
        default: pr-fast
        type: string
      base_sha:
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.manifest.outputs.matrix }}
      execution_allowed: ${{ steps.selection-gate.outputs.execution_allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --global npm@10.9.4

      - run: git config core.filemode false

      # classify must preserve a pristine checkout for catalog provenance.
      - run: npm ci --ignore-scripts

      - name: Resolve governed profile and changed paths
        id: profile
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROFILE: ${{ inputs.requested_profile }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          mkdir -p .artifacts/test-portfolio
          case "$EVENT_NAME" in
            schedule)
              profile=nightly-full
              ;;
            pull_request)
              profile=pr-fast
              ;;
            merge_group)
              profile=pr-fast
              ;;
            *)
              profile="${INPUT_PROFILE:-pr-fast}"
              ;;
          esac
          case "$profile" in
            pr-fast|pr-full|nightly-deep|nightly-full|release-verify|release-full) ;;
            *) echo "::error::PROFILE_UNKNOWN:$profile"; exit 1 ;;
          esac
          base="${INPUT_BASE_SHA:-${PR_BASE_SHA:-${MERGE_GROUP_BASE_SHA:-}}}"
          case "$profile" in
            pr-fast|pr-full|nightly-deep|release-verify)
              if [ -z "$base" ]; then
                echo "::error::CI_BASE_SHA_REQUIRED:$profile"
                exit 1
              fi
              ;;
          esac
          if [ -n "$base" ]; then
            git diff --name-only "$base" "$GITHUB_SHA" |
              node -e "const fs=require('fs');const rows=fs.readFileSync(0,'utf8').split(/\r?\n/u).filter(Boolean).sort();fs.writeFileSync('.artifacts/test-portfolio/changed-paths.json',JSON.stringify(rows));"
          else
            node -e "require('fs').writeFileSync('.artifacts/test-portfolio/changed-paths.json','[]');"
          fi
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Prepare the canonical package once
        run: npm run ci:prepare-package -- --commit-sha "$GITHUB_SHA"

      - name: Generate the governed test plan within budget
        id: planning
        shell: bash
        env:
          BASE_SHA: ${{ steps.profile.outputs.base_sha }}
          PROFILE: ${{ steps.profile.outputs.profile }}
          PR_FAST_PLANNING_BUDGET_SECONDS: '90'
        run: |
          set -euo pipefail

          run_stage() {
            local stage="$1"
            shift
            local started_at_ms
            local ended_at_ms
            started_at_ms="$(date +%s%3N)"
            "$@"
            ended_at_ms="$(date +%s%3N)"
            echo "::notice title=CI planning stage::${stage}=$((ended_at_ms - started_at_ms))ms"
          }

          run_planning() {
            run_stage ci:catalog npm run ci:catalog -- --changed-paths .artifacts/test-portfolio/changed-paths.json
            run_stage ci:profile-policy npm run ci:profile-policy -- --catalog .artifacts/test-portfolio/test-catalog.json --output .artifacts/test-portfolio/test-profile-policy.json
            run_stage ci:timing-bootstrap npm run ci:timing-bootstrap
            run_stage ci:freeze-core npm run ci:freeze-core -- --catalog .artifacts/test-portfolio/test-catalog.json --facts .artifacts/test-portfolio/test-catalog-facts.json --timing-summary .artifacts/test-portfolio/ci-test-timing-summary.json --commit-sha "$GITHUB_SHA" --environment-class linux-x64-node22 --output .artifacts/test-portfolio/core-freeze.json
            run_stage ci:coverage-gap npm run ci:coverage-gap -- --catalog .artifacts/test-portfolio/test-catalog.json --core-freeze .artifacts/test-portfolio/core-freeze.json
            local -a selection_args=(
              --catalog .artifacts/test-portfolio/test-catalog.json
              --core-freeze .artifacts/test-portfolio/core-freeze.json
              --coverage-report .artifacts/test-portfolio/six-model-coverage-gap-report.json
              --profile-policy .artifacts/test-portfolio/test-profile-policy.json
              --requested-profile "$PROFILE"
            )
            if [ -n "$BASE_SHA" ]; then
              selection_args+=(
                --facts .artifacts/test-portfolio/test-catalog-facts.json
                --base-sha "$BASE_SHA"
                --commit-sha "$GITHUB_SHA"
              )
            else
              selection_args+=(
                --changed-paths .artifacts/test-portfolio/changed-paths.json
              )
            fi
            run_stage ci:select npm run ci:select -- "${selection_args[@]}"
            run_stage ci:shard-plan npm run ci:shard-plan -- --selection .artifacts/test-portfolio/test-selection.json --commit-sha "$GITHUB_SHA" --environment-class linux-x64-node22
          }

          export -f run_stage run_planning
          if [ "$PROFILE" = "pr-fast" ]; then
            timeout --foreground --signal=TERM --kill-after=10s \
              "${PR_FAST_PLANNING_BUDGET_SECONDS}s" bash -c 'set -euo pipefail; run_planning'
          else
            run_planning
          fi

      - name: Freeze the planned Run Manifest
        id: manifest
        run: npm run ci:manifest -- --catalog .artifacts/test-portfolio/test-catalog.json --selection .artifacts/test-portfolio/test-selection.json --shard-plan .artifacts/test-portfolio/ci-shard-plan.json --timing-summary .artifacts/test-portfolio/ci-test-timing-summary.json --package-descriptor .artifacts/test-portfolio/package/canonical-package.json --commit-sha "$GITHUB_SHA"

      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan-${{ github.sha }}
          path: .artifacts/test-portfolio/
          if-no-files-found: error
          retention-days: 7

      - name: Gate shard execution on selection readiness
        id: selection-gate
        shell: bash
        run: |
          node -e "const fs=require('fs');const selection=JSON.parse(fs.readFileSync('.artifacts/test-portfolio/test-selection.json','utf8'));if(!['ready','blocked'].includes(selection.selectionStatus))throw new Error('CI_SELECTION_STATUS_INVALID');fs.appendFileSync(process.env.GITHUB_OUTPUT,'execution_allowed='+(selection.selectionStatus === 'ready')+'\n');"

  execute-shard:
    needs: classify
    if: needs.classify.outputs.execution_allowed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm install --global npm@10.9.4

      - run: git config core.filemode false

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan-${{ github.sha }}
          path: .artifacts/test-portfolio

      - name: Prepare generated shard runtime
        run: npm run ci:prepare-shard-runtime

      - name: Execute exact governed shard
        run: npm run ci:run-shard -- --manifest .artifacts/test-portfolio/ci-run-manifest.json --lane "${{ matrix.lane }}" --shard-id "${{ matrix.shardId }}" --descriptor .artifacts/test-portfolio/package/canonical-package.json

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lane-${{ matrix.lane }}-${{ matrix.shardId }}
          path: .artifacts/test-portfolio/lane-results/
          if-no-files-found: error
          retention-days: 7

  evidence-join:
    if: always() && needs.classify.outputs.execution_allowed == 'true'
    needs: [classify, execute-shard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --global npm@10.9.4

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@v4
        with:
          name: ci-plan-${{ github.sha }}
          path: .artifacts/test-portfolio

      - uses: actions/download-artifact@v4
        with:
          pattern: ci-lane-*
          path: .artifacts/test-portfolio/lane-results
          merge-multiple: true

      - name: Join all required evidence
        run: npm run ci:join -- --manifest .artifacts/test-portfolio/ci-run-manifest.json --lane-results-dir .artifacts/test-portfolio/lane-results

      - name: Upload final Run Manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-final-${{ github.sha }}
          path: .artifacts/test-portfolio/final/ci-run-manifest.json
          if-no-files-found: error
          retention-days: 30

  ci-result:
    name: CI required
    if: always()
    needs: [classify, evidence-join]
    runs-on: ubuntu-latest
    steps:
      - name: Expose the only required CI result
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EXECUTION_ALLOWED: ${{ needs.classify.outputs.execution_allowed }}
          EVIDENCE_JOIN_RESULT: ${{ needs.evidence-join.result }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "::error::CI_CLASSIFY_FAILED:$CLASSIFY_RESULT"
            exit 1
          fi
          if [ "$EXECUTION_ALLOWED" != "true" ]; then
            echo "::error::CI_SELECTION_BLOCKED"
            exit 1
          fi
          if [ "$EVIDENCE_JOIN_RESULT" != "success" ]; then
            echo "::error::CI_EVIDENCE_JOIN_FAILED:$EVIDENCE_JOIN_RESULT"
            exit 1
          fi
