version: 1
primaryHost: cursor
packetHosts:
  - cursor
  - claude
  - codex
execution:
  enabled: true
  interactiveMode: main-agent
  fallbackAutonomousMode: false
  authoritativeHost: cursor
  fallbackHosts:
    - claude
    - codex
  dispatch:
    leaseTimeoutSeconds: 900
    heartbeatIntervalSeconds: 60
    maxDispatchAttempts: 3
  execution:
    timeoutMinutes: 30
    maxExecutionAttempts: 2
  rerunGate:
    required: true
    autoSchedule: true
    maxGateRetries: 2
  escalation:
    afterDispatchFailures: 3
    afterExecutionFailures: 2
    afterGateFailures: 2
  projections:
    emitNonAuthoritativePackets: true
    archivePath: _bmad-output/runtime/governance/archive
judgeRuntime:
  schemaVersion: requirements-contract-judge-runtime/v1
  enabled: true
  activeProviderRef: local-codex-judge
  promptConfig:
    systemPromptPath: _bmad/shared/requirements-contract/judge-prompts/requirements-contract-critical-auditor.prompt.md
    outputTokenReserve: 4096
  selectionPolicy:
    mode: contract_locked
    runtimeFallbackAllowed: false
    runtimeAutoDiscoveryAllowed: false
    environmentOverrideAllowed: false
    cliTransportAllowed: true
    selectionReceiptRequired: true
  credentialConfig:
    source: config_file
    path: _bmad-output/config/private/judge-provider.credentials.yaml
    schemaVersion: requirements-contract-judge-credentials/v1
    allowedRoot: _bmad-output/config/private
    environmentFallbackAllowed: false
  providers:
    local-codex-judge:
      enabled: true
      transport: cli
      adapterRef: CodexCliJudgeAdapter
      apiStyle: cli
      credentialRef: local-sonnet-judge
      endpoint:
        command: codex
        baseUrl: http://localhost:3010
        resolutionMode: path_search
        routingOwnership: transport_adapter
        upstreamVersioning: gateway_managed
        explicitOperationPath: null
      authentication:
        type: bearer
        sensitivity: secret
        arbitraryNonEmptyValueAllowed: false
      auditPolicy:
        independenceClass: different_provider_different_model
        blindReview: true
        allowPassAuthority: false
        toolsAllowed: true
        allowedTools:
          - Read
        implementationWritesAllowed: false
      requestPolicy:
        timeoutMs: 1800000
        maximumAttempts: 1
        structuredResponseRequired: true
        maxBudgetUsd: 5
provider:
  mode: openai-compatible
  id: openai-governance
  baseUrl: https://api.openai.com/v1
  model: gpt-5.4
  apiKeyEnv: OPENAI_API_KEY
  timeoutMs: 30000

